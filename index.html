<style>
:root{
  --naranja:#FF8A1F; --naranja-osc:#E8590C; --cacao:#4A2414; --cacao-suave:#6E4A3A;
  --durazno:#FFF1E4; --borde:#F2DFCF; --fondo:#FFFFFF; --rosa:#FF2E7E; --violeta:#7A2FF2;
  --verde:#13A26B; --rojo:#D93636;
  --titulo:'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --texto:'Nunito', 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{font-family:var(--texto);color:var(--cacao);background:var(--fondo);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--naranja-osc)}
h1,h2,h3{font-family:var(--titulo);font-weight:600;line-height:1.15;margin:0 0 .4em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violeta);outline-offset:2px;border-radius:6px}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:#fff}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 20px}
.marca img{height:58px;width:auto}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;color:var(--cacao-suave);font-weight:700;padding:8px 14px;border-radius:999px}
.nav a.on{background:var(--durazno);color:var(--naranja-osc)}
.cuenta{display:flex;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--durazno) center/cover;border:2px solid var(--naranja);display:grid;place-items:center;font-family:var(--titulo);font-weight:700;color:var(--naranja-osc);text-decoration:none}
.abajo{display:none}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;background:var(--naranja);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;text-decoration:none;box-shadow:0 3px 0 var(--naranja-osc);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--naranja-osc)}
.btn.sec{background:#fff;color:var(--cacao);box-shadow:inset 0 0 0 2px var(--borde)}
.btn.peq{padding:8px 14px;font-size:.92rem}
.btn.peligro{background:#fff;color:var(--rojo);box-shadow:inset 0 0 0 2px #F5C9C9}
.btn[disabled]{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--naranja-osc);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}

main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
.cargando{padding:60px 0;text-align:center;color:var(--cacao-suave)}

/* Inicio */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:30px 0 50px}
.lanz{display:inline-block;background:var(--durazno);color:var(--naranja-osc);font-weight:800;padding:6px 14px;border-radius:999px;margin-bottom:18px;font-size:.95rem}
.hero h1{font-size:clamp(2.3rem,5.5vw,4rem);font-weight:700;letter-spacing:-.01em;margin-bottom:.35em}
.hero p{font-size:1.15rem;color:var(--cacao-suave);max-width:34em;margin:0 0 26px}
.hero .acciones{display:flex;gap:12px;flex-wrap:wrap}
.hero-img{position:relative;justify-self:center;width:min(420px,90%)}
.hero-img img{border-radius:22%;transform:rotate(4deg);box-shadow:0 30px 60px -20px rgba(122,47,242,.45)}
.hero-img .burbuja{position:absolute;left:-28px;bottom:34px;background:#fff;border-radius:18px;padding:10px 16px;font-family:var(--titulo);font-weight:600;box-shadow:0 10px 30px -8px rgba(74,36,20,.3);transform:rotate(-5deg)}
.hero-img .burbuja b{color:var(--rosa)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:40px 0;border-top:2px dashed var(--borde)}
.tres .ico{font-size:2.2rem}
.tres h3{font-size:1.35rem;margin-top:8px}
.tres p{margin:0;color:var(--cacao-suave)}
.franja{margin-top:30px;background:var(--cacao);color:#fff;border-radius:28px;padding:36px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.franja h2{font-size:1.7rem}
.franja p{margin:0;opacity:.85;max-width:36em}
footer{text-align:center;color:var(--cacao-suave);font-size:.9rem;padding:30px 20px 100px}

/* Explorar */
.barra{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-bottom:22px}
.barra select{padding:8px 12px;border-radius:12px;border:2px solid var(--borde);background:#fff;font-weight:700}
.segmento{display:inline-flex;background:var(--durazno);border-radius:999px;padding:4px}
.segmento button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:800;cursor:pointer;color:var(--cacao-suave)}
.segmento button.on{background:#fff;color:var(--naranja-osc);box-shadow:0 2px 6px rgba(74,36,20,.12)}
.segmento button.on[data-m="cruce"]{color:var(--rosa)}
.check{display:inline-flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--naranja)}
.aviso{max-width:440px;margin:0 auto 16px;background:#FFF0F6;color:#9A1650;border-radius:14px;padding:10px 14px;font-size:.92rem;text-align:center}
.carta{max-width:440px;margin:0 auto;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 24px 50px -18px rgba(74,36,20,.35);border:1px solid var(--borde);transition:transform .28s ease,opacity .28s ease}
.carta.izq{transform:translateX(-120%) rotate(-14deg);opacity:0}
.carta.der{transform:translateX(120%) rotate(14deg);opacity:0}
.carta .foto{aspect-ratio:4/5;background:var(--durazno) center/cover;display:grid;place-items:center;font-size:5rem;position:relative;cursor:pointer}
.puntos{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px}
.puntos i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.5)}
.puntos i.on{background:#fff}
.carta .info{padding:18px 22px 6px}
.carta h2{font-size:1.9rem;margin:0}
.carta h2 small{font-family:var(--texto);font-size:1.1rem;font-weight:600;color:var(--cacao-suave)}
.carta .meta{margin:2px 0 10px;color:var(--cacao-suave)}
.carta .desc{margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{background:var(--durazno);color:var(--cacao);border-radius:999px;padding:3px 11px;font-size:.85rem;font-weight:700}
.tag.ok{background:#E3F6EE;color:#0B7A50}
.tag.rosa{background:#FFE4EF;color:#B3124F}
.votos{display:flex;justify-content:center;gap:22px;padding:16px 0 22px}
.redondo{border:0;cursor:pointer;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.pasar{width:64px;height:64px;background:#fff;box-shadow:inset 0 0 0 2px var(--borde);font-size:1.5rem;color:var(--cacao-suave)}
.like{height:64px;padding:0 28px;background:var(--rosa);color:#fff;font-size:1.1rem;box-shadow:0 4px 0 #C4115A}
.like:active,.pasar:active{transform:scale(.95)}

/* Vacío */
.vacio{text-align:center;max-width:460px;margin:30px auto;padding:30px}
.vacio .ico{font-size:3.4rem}
.vacio p{color:var(--cacao-suave)}

/* Listas y fichas */
.cabeza{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.cabeza h1{font-size:2rem;margin:0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ficha{background:#fff;border:1px solid var(--borde);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.ficha .foto{aspect-ratio:1;background:var(--durazno) center/cover;display:grid;place-items:center;font-size:3rem}
.ficha .cuerpo{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.ficha h3{font-size:1.3rem;margin:0}
.ficha .fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.inactivo{opacity:.55}

.lista{display:flex;flex-direction:column;gap:10px;max-width:640px}
.item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--borde);text-decoration:none;color:inherit}
.item:hover{border-color:var(--naranja)}
.mini{width:58px;height:58px;border-radius:50%;background:var(--durazno) center/cover;flex:none;display:grid;place-items:center;font-size:1.6rem}
.item .txt{flex:1;min-width:0}
.item .txt b{font-family:var(--titulo);font-weight:600;font-size:1.15rem}
.item .txt span{display:block;color:var(--cacao-suave);font-size:.92rem}
.contador{background:var(--rosa);color:#fff;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.8rem;font-weight:800;padding:0 7px}

/* Chat */
.chat{max-width:680px;margin:0 auto;display:flex;flex-direction:column;height:calc(100dvh - 190px);min-height:420px;background:#fff;border:1px solid var(--borde);border-radius:24px;overflow:hidden}
.chat-top{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--borde)}
.chat-top .mini{width:44px;height:44px}
.chat-top .txt{flex:1}
.mensajes{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#FFFAF5}
.msj{max-width:78%;padding:9px 14px;border-radius:18px;background:#fff;border:1px solid var(--borde);word-wrap:break-word;white-space:pre-wrap}
.msj.mio{align-self:flex-end;background:var(--naranja);color:#fff;border-color:var(--naranja)}
.msj small{display:block;font-size:.72rem;opacity:.7;margin-top:2px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--borde)}
.chat input{flex:1;border:2px solid var(--borde);border-radius:999px;padding:10px 16px}

/* Servicios */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:none;border:2px solid var(--borde);background:#fff;border-radius:999px;padding:7px 15px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--naranja);background:var(--durazno);color:var(--naranja-osc)}
.buscar{border:2px solid var(--borde);border-radius:14px;padding:10px 14px;width:min(320px,100%);margin-bottom:20px}
.estrellas{color:#F5A300;font-weight:800}
.verif{color:var(--verde);font-weight:800;font-size:.85rem}
.mis-negocios{background:var(--durazno);border-radius:24px;padding:20px;margin-bottom:28px}
.mis-negocios h2{font-size:1.3rem}

/* Formularios */
.form{display:grid;gap:14px}
.form .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:5px;font-weight:700;font-size:.93rem}
.form input:not([type=checkbox]),.form select,.form textarea{border:2px solid var(--borde);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--naranja);outline:none}
.form textarea{min-height:84px;resize:vertical}
.form .checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .check{font-weight:600}
.ayuda{font-size:.85rem;color:var(--cacao-suave);font-weight:400}
.fotos-act{display:flex;gap:8px;flex-wrap:wrap}
.fotos-act div{position:relative;width:70px;height:70px;border-radius:12px;background:center/cover}
.fotos-act button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--rojo);color:#fff;cursor:pointer;font-weight:800;line-height:1}
.error{color:var(--rojo);font-weight:700;font-size:.92rem;min-height:1em;margin:0}

/* Modal */
.velo{position:fixed;inset:0;background:rgba(74,36,20,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 14px 20px;overflow-y:auto}
.velo.on{display:flex}
.caja{background:#fff;border-radius:26px;width:min(560px,100%);padding:26px;position:relative;margin:auto 0;animation:sube .22s ease}
@keyframes sube{from{transform:translateY(16px);opacity:0}}
.cerrar{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--durazno);cursor:pointer;font-size:1.1rem}
.pestanas{display:flex;gap:6px;margin-bottom:18px}
.pestanas button{flex:1;border:0;background:var(--durazno);padding:10px;border-radius:12px;font-weight:800;cursor:pointer;color:var(--cacao-suave)}
.pestanas button.on{background:var(--naranja);color:#fff}
.auth-logo{width:170px;margin:0 auto 14px}

/* Match */
.match{text-align:center}
.match h2{font-size:2.4rem;color:var(--rosa);font-weight:700}
.match .pareja{display:flex;justify-content:center;margin:16px 0 20px}
.match .pareja div{width:120px;height:120px;border-radius:50%;border:5px solid #fff;box-shadow:0 8px 24px rgba(255,46,126,.35);background:var(--durazno) center/cover;display:grid;place-items:center;font-size:3rem}
.match .pareja div+div{margin-left:-24px}
.match .acciones{display:flex;flex-direction:column;gap:10px}

/* Proveedor */
.prov-top{display:flex;gap:14px;align-items:center;margin-bottom:12px;padding-right:30px}
.prov-top .mini{width:72px;height:72px;border-radius:18px}
.serv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--borde)}
.serv:last-child{border:0}
.resena{padding:10px 0;border-bottom:1px dashed var(--borde)}
.seccion{margin-top:20px}
.seccion h3{font-size:1.15rem}

/* Aviso de configuración */
.config{background:#FFF4D6;color:#7A5200;padding:12px 20px;text-align:center;font-weight:700}
.config code{background:#fff;padding:2px 6px;border-radius:6px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cacao);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--rojo)}

@media (max-width:820px){
  .nav{display:none}
  .cuenta{margin-left:auto}
  .marca img{height:50px}
  .abajo{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--borde);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .abajo a{flex:1;text-align:center;text-decoration:none;color:var(--cacao-suave);font-size:.72rem;font-weight:800;padding:4px 0;border-radius:12px}
  .abajo a span{display:block;font-size:1.35rem;line-height:1.3}
  .abajo a.on{color:var(--naranja-osc);background:var(--durazno)}
  main{padding:18px 16px 110px}
  .hero{grid-template-columns:1fr;gap:28px;padding-top:10px;text-align:center}
  .hero p{margin-left:auto;margin-right:auto}
  .hero .acciones{justify-content:center}
  .hero-img{grid-row:1;width:min(300px,78%)}
  .hero-img .burbuja{left:-10px}
  .tres{grid-template-columns:1fr;text-align:center}
  .franja{padding:26px;text-align:center;justify-content:center}
  .form .dos,.form .checks{grid-template-columns:1fr}
  .chat{height:calc(100dvh - 220px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

$('#anio').textContent = new Date().getFullYear();

/* ---------- utilidades ---------- */
function app(html){ $('#app').innerHTML = html; }
function toast(msg, tipo){
  const t = document.createElement('div'); t.className = 'toast' + (tipo === 'err' ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3600);
}
function modal(html){ $('#caja').innerHTML = '<button class="cerrar" aria-label="Cerrar" onclick="cerrarModal()">✕</button>' + html; $('#velo').classList.add('on'); document.body.style.overflow = 'hidden'; }
function cerrarModal(){ $('#velo').classList.remove('on'); document.body.style.overflow = ''; }
$('#velo').addEventListener('click', e => { if (e.target.id === 'velo') cerrarModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
function fotos(d){ return (d?.dog_photos || []).slice().sort((a,b) => a.orden - b.orden).map(f => f.url); }
function foto(d){ return fotos(d)[0] || ''; }
function bg(url){ return url ? `style="background-image:url('${esc(url)}')"` : ''; }
function edad(f){
  if (!f) return '';
  const n = new Date(f), h = new Date();
  let m = (h.getFullYear() - n.getFullYear()) * 12 + h.getMonth() - n.getMonth();
  if (h.getDate() < n.getDate()) m--;
  if (m < 0) return '';
  if (m < 12) return m <= 1 ? '1 mes' : m + ' meses';
  const a = Math.floor(m / 12); return a === 1 ? '1 año' : a + ' años';
}
function cop(n){ return n == null ? '' : new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(n); }
function fecha(f){ return new Date(f).toLocaleDateString('es-CO', {day:'numeric', month:'short'}); }
function hora(f){ return new Date(f).toLocaleTimeString('es-CO', {hour:'numeric', minute:'2-digit'}); }
function wa(n){ let d = String(n || '').replace(/\D/g, ''); if (d.length === 10) d = '57' + d; return d; }
function traducir(err){
  const m = err?.message || String(err);
  if (/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Primero confirma tu correo con el enlace que te enviamos.';
  if (/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Ingresa con tu contraseña.';
  if (/Password should be/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  if (/duplicate key.*reviews/i.test(m)) return 'Ya dejaste una reseña para este negocio.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos y vuelve a intentar.';
  return m;
}
async function comprimir(file){
  if (!file.type.startsWith('image/')) throw new Error('El archivo debe ser una imagen.');
  let img;
  try { img = await createImageBitmap(file); } catch { throw new Error('Usa fotos en formato JPG, PNG o WEBP.'); }
  const s = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}
async function subir(file, carpeta){
  const blob = await comprimir(file);
  const ruta = `${S.user.id}/${carpeta}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await sb.storage.from('fotos').upload(ruta, blob, { contentType:'image/jpeg' });
  if (error) throw error;
  return sb.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
}
function ocupado(btn, si, texto){ if (!btn) return; btn.disabled = si; if (si){ btn.dataset.t = btn.textContent; btn.textContent = texto || 'Guardando…'; } else if (btn.dataset.t) btn.textContent = btn.dataset.t; }

const MENU = [

function pintarMenu(ruta){
  const enlaces = S.user ? MENU : [['inicio','🏠','Inicio'], ['servicios','🩺','Servicios']];
  $('#nav').innerHTML = enlaces.filter(m => m[0] !== 'perfil').map(([r,,t]) => `<a href="#${r}" class="${r === ruta ? 'on' : ''}">${t}</a>`).join('');

const PRIVADAS = ['explorar','matches','chat','perros','perfil'];
async function render(){
  clearInterval(S.chatTimer);
  let [ruta, param] = location.hash.slice(1).split('/');
  if (!RUTAS[ruta]) ruta = S.user ? 'explorar' : 'inicio';
  if (PRIVADAS.includes(ruta) && !S.user){ ruta = 'inicio'; setTimeout(() => abrirAuth('login'), 50); }

}

async function cargarMiInfo(){
  if (!S.user){ S.profile = null; S.dogs = []; return; }
  const [p, d] = await Promise.all([
    sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle(),
    sb.from('dogs').select('*, dog_photos(id,url,orden)').eq('owner_id', S.user.id).order('created_at')
  ]);
  S.profile = p.data; S.dogs = d.data || [];
  if (!S.dogs.find(x => x.id === S.dogId)) S.dogId = (S.dogs.find(x => x.activo) || S.dogs[0])?.id || null;
}

function abrirAuth(tab){
  const reg = tab === 'registro';
  modal(`
    <img class="auth-logo" src="${LOGO}" alt="GuauMatch">
    <div class="pestanas">
      <button class="${reg ? '' : 'on'}" onclick="abrirAuth('login')">Ingresar</button>
      <button class="${reg ? 'on' : ''}" onclick="abrirAuth('registro')">Crear cuenta</button>
    </div>
    <form class="form" id="fAuth">
      ${reg ? '<label>Tu nombre<input name="nombre" required autocomplete="name" placeholder="Ej: Laura Gómez"></label>' : ''}
      <label>Correo<input name="email" type="email" required autocomplete="email" placeholder="tucorreo@ejemplo.com"></label>
      <label>Contraseña<input name="password" type="password" required minlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}" placeholder="Mínimo 6 caracteres"></label>
      <p class="error" id="eAuth"></p>
      <button class="btn" type="submit">${reg ? 'Crear cuenta gratis' : 'Ingresar'}</button>
      ${reg ? '<p class="ayuda">Al crear tu cuenta aceptas usar GuauMatch de forma respetuosa y responsable con los animales.</p>' : '<button type="button" class="link" onclick="recuperar()">¿Olvidaste tu contraseña?</button>'}
    </form>`);
  $('#fAuth').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)); const btn = e.target.querySelector('[type=submit]');
    $('#eAuth').textContent = ''; ocupado(btn, true, 'Un momento…');
    try {
      if (reg){
        const { data, error } = await sb.auth.signUp({ email:f.email, password:f.password, options:{ data:{ nombre:f.nombre }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!data.session){
          modal(`<div class="vacio"><div class="ico">📬</div><h2>Revisa tu correo</h2><p>Te enviamos un enlace a <b>${esc(f.email)}</b> para confirmar tu cuenta. Ábrelo y volverás a GuauMatch con tu sesión iniciada.</p><button class="btn" onclick="cerrarModal()">Entendido</button></div>`);
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email:f.email, password:f.password });
        if (error) throw error;
      }
      cerrarModal();
      toast(reg ? '¡Bienvenido a GuauMatch! 🐾' : '¡Hola de nuevo! 🐾');
    } catch (err){ $('#eAuth').textContent = traducir(err); ocupado(btn, false); }
  };
}
async function recuperar(){
  const email = $('#fAuth [name=email]').value.trim();
  if (!email){ $('#eAuth').textContent = 'Escribe tu correo arriba y vuelve a tocar "¿Olvidaste tu contraseña?".'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error){ $('#eAuth').textContent = traducir(error); return; }
  modal(`<div class="vacio"><div class="ico">📬</div><h2>Revisa tu correo</h2><p>Te enviamos un enlace para crear una contraseña nueva.</p><button class="btn" onclick="cerrarModal()">Entendido</button></div>`);
}
function nuevaClave(){
  modal(`<h2>Crea tu nueva contraseña</h2>
    <form class="form" id="fClave"><label>Nueva contraseña<input name="p" type="password" minlength="6" required autocomplete="new-password"></label>
    <p class="error" id="eClave"></p><button class="btn">Guardar contraseña</button></form>`);
  $('#fClave').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: e.target.p.value });
    if (error){ $('#eClave').textContent = traducir(error); return; }
    cerrarModal(); toast('Contraseña actualizada');
  };
}

  const activos = S.dogs.filter(d => d.activo);
  if (!activos.length){
    app(`<div class="vacio"><div class="ico">🐶</div><h2>Primero registra a tu perro</h2><p>Crea su perfil con una buena foto para empezar a encontrar amigos y pareja.</p><a class="btn" href="#perros">Registrar mi perro</a></div>`);
    return;
  }
  if (!activos.find(d => d.id === S.dogId)) S.dogId = activos[0].id;
  const yo = activos.find(d => d.id === S.dogId);
  app(`
    <div class="barra">
      ${activos.length > 1 ? `<label>Buscando para <select id="selPerro">${activos.map(d => `<option value="${d.id}" ${d.id === S.dogId ? 'selected' : ''}>${esc(d.nombre)}</option>`).join('')}</select></label>` : `<b>Buscando para ${esc(yo.nombre)}</b>`}
      <div class="segmento" role="group" aria-label="Qué buscas">
        <button data-m="amistad" class="${S.modo === 'amistad' ? 'on' : ''}">🦮 Amigos</button>
        <button data-m="cruce" class="${S.modo === 'cruce' ? 'on' : ''}">💞 Cruce</button>
      </div>
      ${yo.ciudad ? `<label class="check"><input type="checkbox" id="soloCiudad" ${S.soloCiudad ? 'checked' : ''}> Solo en ${esc(yo.ciudad)}</label>` : ''}
    </div>
    ${S.modo === 'cruce' ? '<p class="aviso">Antes de un cruce, verifiquen juntos vacunas y estado de salud con un veterinario. 🩺</p>' : ''}
    <div id="pila"><div class="cargando">Buscando perros…</div></div>`);
  $('#selPerro') && ($('#selPerro').onchange = e => { S.dogId = e.target.value; vExplorar(); });
  document.querySelectorAll('.segmento button').forEach(b => b.onclick = () => { S.modo = b.dataset.m; vExplorar(); });
  $('#soloCiudad') && ($('#soloCiudad').onchange = e => { S.soloCiudad = e.target.checked; cargarCandidatos(); });
  await cargarCandidatos();
}
async function cargarCandidatos(){
  const yo = S.dogs.find(d => d.id === S.dogId), pila = $('#pila');
  if (S.modo === 'cruce' && !yo.busca_cruce){
    pila.innerHTML = `<div class="vacio"><div class="ico">💞</div><h2>${esc(yo.nombre)} no está disponible para cruce</h2><p>Activa la opción "Disponible para cruce" en su perfil. Solo aplica para perros no esterilizados.</p><a class="btn" href="#perros">Editar a ${esc(yo.nombre)}</a></div>`; return;
  }
  if (S.modo === 'amistad' && !yo.busca_amigos){
    pila.innerHTML = `<div class="vacio"><div class="ico">🦮</div><h2>${esc(yo.nombre)} no está buscando amigos</h2><p>Activa la opción "Busca amigos de paseo" en su perfil.</p><a class="btn" href="#perros">Editar a ${esc(yo.nombre)}</a></div>`; return;
  }
  let q = sb.from('dogs').select('*, dog_photos(url,orden)').eq('activo', true).neq('owner_id', S.user.id).order('created_at', {ascending:false}).limit(80);
  q = S.modo === 'cruce' ? q.eq('busca_cruce', true).neq('sexo', yo.sexo) : q.eq('busca_amigos', true);
  if (S.soloCiudad && yo.ciudad) q = q.ilike('ciudad', yo.ciudad.trim());
  const [r, l] = await Promise.all([q, sb.from('likes').select('to_dog_id').eq('from_dog_id', yo.id).eq('tipo', S.modo)]);
  if (r.error) throw r.error;
  const vistos = new Set((l.data || []).map(x => x.to_dog_id));
  S.cands = (r.data || []).filter(d => !vistos.has(d.id));
  mostrarCarta();
}
function mostrarCarta(){
  const pila = $('#pila'); if (!pila) return;
  const d = S.cands[0]; S.fotoIdx = 0;
  if (!d){
    pila.innerHTML = `<div class="vacio"><div class="ico">🐾</div><h2>Ya viste todos por ahora</h2><p>Vuelve más tarde, cada día llegan perros nuevos.${S.soloCiudad ? ' También puedes quitar el filtro de ciudad.' : ''}</p><a class="btn sec" href="#matches">Ver mis matches</a></div>`;
    return;
  }
  const fs = fotos(d), e = edad(d.fecha_nacimiento);
  const tags = [
    d.sexo === 'macho' ? '♂ Macho' : '♀ Hembra',
    d.tamano ? TAMANOS[d.tamano] : '',
  ].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')
    + (d.vacunas_al_dia ? '<span class="tag ok">💉 Vacunas al día</span>' : '')
    + (d.tiene_pedigri ? '<span class="tag rosa">🏅 Pedigrí</span>' : '')
    + (d.esterilizado ? '<span class="tag">Esterilizado</span>' : '');
  pila.innerHTML = `
    <article class="carta" id="carta">
      <div class="foto" id="cartaFoto" ${bg(fs[0])}>${fs.length ? '' : '🐶'}
        ${fs.length > 1 ? `<div class="puntos">${fs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      </div>
      <div class="info">
        <h2>${esc(d.nombre)} ${e ? `<small>${e}</small>` : ''}</h2>
        <p class="meta">${[d.raza || 'Raza sin especificar', d.ciudad].filter(Boolean).map(esc).join(', ')}</p>
        <div class="tags">${tags}</div>
        ${d.descripcion ? `<p class="desc">${esc(d.descripcion)}</p>` : ''}
      </div>
      <div class="votos">
        <button class="redondo pasar" aria-label="Pasar" onclick="votar(false)">✕</button>
        <button class="redondo like" onclick="votar(true)">🐾 Me gusta</button>
      </div>
    </article>`;
  if (fs.length > 1) $('#cartaFoto').onclick = () => {
    S.fotoIdx = (S.fotoIdx + 1) % fs.length;
    $('#cartaFoto').style.backgroundImage = `url('${fs[S.fotoIdx]}')`;
    document.querySelectorAll('.puntos i').forEach((p, i) => p.classList.toggle('on', i === S.fotoIdx));
  };
}
async function votar(gusta){
  const d = S.cands[0], yo = S.dogs.find(x => x.id === S.dogId); if (!d) return;
  const carta = $('#carta'); carta.classList.add(gusta ? 'der' : 'izq');
  carta.querySelectorAll('button').forEach(b => b.disabled = true);
  const [{ error }] = await Promise.all([
    sb.from('likes').insert({ from_dog_id: yo.id, to_dog_id: d.id, tipo: S.modo, le_gusta: gusta }),
    new Promise(r => setTimeout(r, 280))
  ]);
  S.cands.shift();
  if (error && !/duplicate/i.test(error.message)) toast(traducir(error), 'err');
  if (gusta && !error){
    const { data: m } = await sb.from('matches').select('id').eq('tipo', S.modo)
      .or(`and(dog_a.eq.${yo.id},dog_b.eq.${d.id}),and(dog_a.eq.${d.id},dog_b.eq.${yo.id})`).maybeSingle();
    if (m) mostrarMatch(yo, d, m.id);
  }
  mostrarCarta();
}
function mostrarMatch(yo, otro, id){
  modal(`<div class="match">
    <h2>¡Es un match!</h2>
    <p>${esc(yo.nombre)} y ${esc(otro.nombre)} se gustaron mutuamente ${S.modo === 'cruce' ? 'para cruce 💞' : 'como amigos 🦮'}.</p>
    <div class="pareja"><div ${bg(foto(yo))}>${foto(yo) ? '' : '🐶'}</div><div ${bg(foto(otro))}>${foto(otro) ? '' : '🐶'}</div></div>
    <div class="acciones"><a class="btn" href="#chat/${id}" onclick="cerrarModal()">Enviar mensaje</a><button class="btn sec" onclick="cerrarModal()">Seguir explorando</button></div>
  </div>`);
}

/* ---------- MATCHES ---------- */
const SEL_MATCH = 'id,tipo,created_at,a:dogs!matches_dog_a_fkey(id,nombre,raza,ciudad,owner_id,dog_photos(url,orden)),b:dogs!matches_dog_b_fkey(id,nombre,raza,ciudad,owner_id,dog_photos(url,orden))';
function lados(m){ const aMio = m.a?.owner_id === S.user.id; return { mio: aMio ? m.a : m.b, otro: aMio ? m.b : m.a }; }
async function vMatches(){
  const [r, nl] = await Promise.all([
    sb.from('matches').select(SEL_MATCH).order('created_at', {ascending:false}),
    sb.from('messages').select('match_id').eq('leido', false).neq('sender_id', S.user.id)
  ]);
  if (r.error) throw r.error;
  const pend = {}; (nl.data || []).forEach(x => pend[x.match_id] = (pend[x.match_id] || 0) + 1);
  const ms = (r.data || []).filter(m => m.a && m.b);
  if (!ms.length){
    app(`<div class="vacio"><div class="ico">💬</div><h2>Aún no tienes matches</h2><p>Cuando a otro perro también le guste el tuyo, aparecerá aquí y podrán chatear.</p><a class="btn" href="#explorar">Explorar perros</a></div>`);
    return;
  }
  app(`<div class="cabeza"><h1>Tus matches</h1></div>
    <div class="lista">${ms.map(m => { const { mio, otro } = lados(m); return `
      <a class="item" href="#chat/${m.id}">
        <div class="mini" ${bg(foto(otro))}>${foto(otro) ? '' : '🐶'}</div>
        <div class="txt"><b>${esc(otro.nombre)}</b><span>${m.tipo === 'cruce' ? '💞 Cruce' : '🦮 Amistad'} con ${esc(mio.nombre)}${otro.ciudad ? ', ' + esc(otro.ciudad) : ''}</span></div>
        ${pend[m.id] ? `<span class="contador">${pend[m.id]}</span>` : ''}
      </a>`; }).join('')}</div>`);
}
async function vChat(id){
  const { data: m, error } = await sb.from('matches').select(SEL_MATCH).eq('id', id).maybeSingle();
  if (error) throw error;
  if (!m || !m.a || !m.b){ app(`<div class="vacio"><div class="ico">🔍</div><h2>Este match ya no está disponible</h2><a class="btn" href="#matches">Volver a matches</a></div>`); return; }
  const { mio, otro } = lados(m);
  app(`<div class="chat">
    <div class="chat-top">
      <a href="#matches" class="btn sec peq" aria-label="Volver">←</a>
      <div class="mini" ${bg(foto(otro))}>${foto(otro) ? '' : '🐶'}</div>
      <div class="txt"><b>${esc(otro.nombre)}</b><br><span class="ayuda">${m.tipo === 'cruce' ? '💞 Cruce' : '🦮 Amistad'} con ${esc(mio.nombre)}</span></div>
      <button class="btn peligro peq" onclick="deshacer('${m.id}')">Deshacer match</button>
    </div>
    <div class="mensajes" id="mensajes"><div class="cargando">Cargando mensajes…</div></div>
    <form id="fMsj"><input name="t" maxlength="2000" placeholder="Escribe un mensaje…" autocomplete="off" required><button class="btn">Enviar</button></form>
  </div>`);
  S.ultimos = -1;
  await cargarMensajes(id);
  S.chatTimer = setInterval(() => cargarMensajes(id), 4000);
  $('#fMsj').onsubmit = async e => {
    e.preventDefault();
    const t = e.target.t.value.trim(); if (!t) return;
    e.target.t.value = '';
    const { error } = await sb.from('messages').insert({ match_id: id, sender_id: S.user.id, contenido: t });
    if (error){ toast(traducir(error), 'err'); e.target.t.value = t; return; }
    cargarMensajes(id);
  };
}
async function cargarMensajes(id){
  const box = $('#mensajes'); if (!box) return;
  const { data } = await sb.from('messages').select('*').eq('match_id', id).order('created_at').limit(500);
  const ms = data || [];
  if (ms.length === S.ultimos) return;
  S.ultimos = ms.length;
  box.innerHTML = ms.length ? ms.map(x => `<div class="msj ${x.sender_id === S.user.id ? 'mio' : ''}">${esc(x.contenido)}<small>${fecha(x.created_at)}, ${hora(x.created_at)}</small></div>`).join('')
    : '<div class="vacio"><div class="ico">👋</div><p>Rompe el hielo: propón un paseo o cuéntales algo de tu perro.</p></div>';
  box.scrollTop = box.scrollHeight;
  if (ms.some(x => !x.leido && x.sender_id !== S.user.id))
    sb.from('messages').update({ leido: true }).eq('match_id', id).neq('sender_id', S.user.id).eq('leido', false).then(() => {});
}
async function deshacer(id){
  if (!confirm('¿Seguro que quieres deshacer este match? Se borrará la conversación.')) return;
  const { error } = await sb.from('matches').delete().eq('id', id);
  if (error) return toast(traducir(error), 'err');
  toast('Match deshecho'); location.hash = '#matches';
}

/* ---------- MIS PERROS ---------- */
async function vPerros(){
  await cargarMiInfo();
  app(`<div class="cabeza"><h1>Mis perros</h1><button class="btn" onclick="formPerro()">＋ Agregar perro</button></div>
    ${S.dogs.length ? `<div class="rejilla">${S.dogs.map(d => `
      <div class="ficha ${d.activo ? '' : 'inactivo'}">
        <div class="foto" ${bg(foto(d))}>${foto(d) ? '' : '🐶'}</div>
        <div class="cuerpo">
          <h3>${esc(d.nombre)}</h3>
          <span class="ayuda">${[d.raza, edad(d.fecha_nacimiento), d.ciudad].filter(Boolean).map(esc).join(', ')}</span>
          <div class="tags">${d.busca_amigos ? '<span class="tag">🦮 Amigos</span>' : ''}${d.busca_cruce ? '<span class="tag rosa">💞 Cruce</span>' : ''}${d.activo ? '' : '<span class="tag">Oculto</span>'}</div>
          <div class="fila">
            <button class="btn peq" onclick="formPerro('${d.id}')">Editar</button>
            <button class="btn sec peq" onclick="activarPerro('${d.id}', ${!d.activo})">${d.activo ? 'Ocultar' : 'Mostrar'}</button>
            <button class="btn peligro peq" onclick="borrarPerro('${d.id}')">Eliminar</button>
          </div>
        </div>
      </div>`).join('')}</div>`
    : `<div class="vacio"><div class="ico">🐶</div><h2>Registra a tu primer perro</h2><p>Con su perfil y una buena foto podrás encontrarle amigos de paseo o pareja para cruce.</p><button class="btn" onclick="formPerro()">Agregar perro</button></div>`}`);
}
function formPerro(id){
  const d = S.dogs.find(x => x.id === id) || { busca_amigos:true, activo:true, ciudad: S.profile?.ciudad || '' };
  const opt = (obj, val) => Object.entries(obj).map(([k,v]) => `<option value="${k}" ${val === k ? 'selected' : ''}>${v}</option>`).join('');
  modal(`<h2>${id ? 'Editar a ' + esc(d.nombre) : 'Nuevo perro'}</h2>
    <form class="form" id="fPerro">
      <div class="dos">
        <label>Nombre<input name="nombre" required value="${esc(d.nombre || '')}" placeholder="Ej: Rocky"></label>
        <label>Raza<input name="raza" value="${esc(d.raza || '')}" placeholder="Ej: Golden retriever o criollo"></label>
      </div>
      <div class="dos">
        <label>Sexo<select name="sexo" required><option value="">Elige…</option>${opt({macho:'Macho', hembra:'Hembra'}, d.sexo)}</select></label>
        <label>Tamaño<select name="tamano"><option value="">Elige…</option>${opt(TAMANOS, d.tamano)}</select></label>
      </div>
      <div class="dos">
        <label>Fecha de nacimiento<input name="fecha_nacimiento" type="date" max="${new Date().toISOString().slice(0,10)}" value="${d.fecha_nacimiento || ''}"></label>
        <label>Ciudad<input name="ciudad" value="${esc(d.ciudad || '')}" placeholder="Ej: Cali"></label>
      </div>
      <label>Sobre ${esc(d.nombre || 'tu perro')}<textarea name="descripcion" maxlength="500" placeholder="Personalidad, qué le gusta, cómo se lleva con otros perros…">${esc(d.descripcion || '')}</textarea></label>
      <div class="checks">
        <label class="check"><input type="checkbox" name="busca_amigos" ${d.busca_amigos ? 'checked' : ''}> Busca amigos de paseo</label>
        <label class="check"><input type="checkbox" name="busca_cruce" ${d.busca_cruce ? 'checked' : ''}> Disponible para cruce</label>
        <label class="check"><input type="checkbox" name="esterilizado" ${d.esterilizado ? 'checked' : ''}> Esterilizado</label>
        <label class="check"><input type="checkbox" name="vacunas_al_dia" ${d.vacunas_al_dia ? 'checked' : ''}> Vacunas al día</label>
        <label class="check"><input type="checkbox" name="tiene_pedigri" ${d.tiene_pedigri ? 'checked' : ''}> Tiene pedigrí</label>
      </div>
      ${fotos(d).length ? `<div><b>Fotos actuales</b><div class="fotos-act">${(d.dog_photos || []).map(f => `<div ${bg(f.url)}><button type="button" aria-label="Quitar foto" onclick="quitarFoto('${f.id}','${d.id}')">×</button></div>`).join('')}</div></div>` : ''}
      <label>${fotos(d).length ? 'Agregar más fotos' : 'Fotos'}<input name="fotos" type="file" accept="image/jpeg,image/png,image/webp" multiple><span class="ayuda">La primera foto será la principal. Puedes subir varias.</span></label>
      <p class="error" id="ePerro"></p>
      <button class="btn">${id ? 'Guardar cambios' : 'Registrar perro'}</button>
    </form>`);
  const f = $('#fPerro'), est = f.esterilizado, cru = f.busca_cruce;
  const sync = () => { cru.disabled = est.checked; if (est.checked) cru.checked = false; };
  est.onchange = sync; sync();
  f.onsubmit = async e => {
    e.preventDefault(); const btn = f.querySelector('button.btn'); $('#ePerro').textContent = ''; ocupado(btn, true);
    try {
      const v = Object.fromEntries(new FormData(f));
      const datos = {
        nombre: v.nombre.trim(), raza: v.raza.trim() || null, sexo: v.sexo, tamano: v.tamano || null,
        fecha_nacimiento: v.fecha_nacimiento || null, ciudad: v.ciudad.trim() || null, descripcion: v.descripcion.trim() || null,
        busca_amigos: f.busca_amigos.checked, busca_cruce: f.busca_cruce.checked && !f.esterilizado.checked,
        esterilizado: f.esterilizado.checked, vacunas_al_dia: f.vacunas_al_dia.checked, tiene_pedigri: f.tiene_pedigri.checked
      };
      let dogId = id;
      if (id){ const { error } = await sb.from('dogs').update(datos).eq('id', id); if (error) throw error; }
      else { const { data, error } = await sb.from('dogs').insert({ ...datos, owner_id: S.user.id }).select('id').single(); if (error) throw error; dogId = data.id; }
      const archivos = [...f.fotos.files]; const base = (d.dog_photos || []).length;
      for (let i = 0; i < archivos.length; i++){
        btn.textContent = `Subiendo foto ${i + 1} de ${archivos.length}…`;
        const url = await subir(archivos[i], 'perros');
        const { error } = await sb.from('dog_photos').insert({ dog_id: dogId, url, orden: base + i }); if (error) throw error;
      }
      cerrarModal(); toast(id ? 'Cambios guardados' : '¡Perro registrado! 🐶'); vPerros();
    } catch (err){ $('#ePerro').textContent = traducir(err); ocupado(btn, false); }
  };
}
async function quitarFoto(fid, dogId){
  const { error } = await sb.from('dog_photos').delete().eq('id', fid);
  if (error) return toast(traducir(error), 'err');
  await cargarMiInfo(); formPerro(dogId);
}
async function activarPerro(id, activo){
  const { error } = await sb.from('dogs').update({ activo }).eq('id', id);
  if (error) return toast(traducir(error), 'err');
  toast(activo ? 'Ahora otros pueden ver a tu perro' : 'Tu perro quedó oculto'); vPerros();
}
async function borrarPerro(id){
  if (!confirm('¿Eliminar este perro? También se borrarán sus likes, matches y conversaciones.')) return;
  const { error } = await sb.from('dogs').delete().eq('id', id);
  if (error) return toast(traducir(error), 'err');
  toast('Perro eliminado'); vPerros();
}

/* ---------- SERVICIOS ---------- */
function promedio(rs){ if (!rs?.length) return null; return rs.reduce((s, r) => s + r.calificacion, 0) / rs.length; }
function estrellas(p, n){ return p == null ? '<span class="ayuda">Sin reseñas aún</span>' : `<span class="estrellas">★ ${p.toFixed(1).replace('.', ',')}</span> <span class="ayuda">(${n})</span>`; }
function tarjetaNegocio(p){
  const pr = promedio(p.reviews);
  return `<div class="ficha ${p.activo ? '' : 'inactivo'}">
    <div class="foto" ${bg(p.logo_url)}>${p.logo_url ? '' : CAT_ICO[p.categoria]}</div>
    <div class="cuerpo">
      <h3>${esc(p.nombre_negocio)}</h3>
      ${p.verificado ? '<span class="verif">✔ Verificado por GuauMatch</span>' : ''}
      <span class="ayuda">${CAT_ICO[p.categoria]} ${CATS[p.categoria]}${p.ciudad ? ', ' + esc(p.ciudad) : ''}</span>
      <div>${estrellas(pr, p.reviews?.length)}</div>
      <div class="fila"><button class="btn peq" onclick="verNegocio('${p.id}')">Ver detalles</button></div>
    </div>
  </div>`;
}
async function vServicios(){
  const cats = [['', 'Todos'], ...Object.entries(CATS)];
  let mios = [];
  if (S.user){
    const { data } = await sb.from('providers').select('*, reviews(calificacion)').eq('owner_id', S.user.id).order('created_at');
    mios = data || [];
  }
  app(`<div class="cabeza"><h1>Servicios para tu perro</h1>
      <button class="btn sec" onclick="${S.user ? 'formNegocio()' : "abrirAuth('registro')"}">＋ Registrar mi negocio</button></div>
    ${mios.length ? `<section class="mis-negocios"><h2>Mis negocios</h2><div class="rejilla">${mios.map(tarjetaNegocio).join('')}</div></section>` : ''}
    <div class="chips">${cats.map(([k, t]) => `<button class="chip ${S.cat === k ? 'on' : ''}" data-c="${k}">${k ? CAT_ICO[k] + ' ' : ''}${t}</button>`).join('')}</div>
    <input class="buscar" id="bCiudad" placeholder="🔎 Filtrar por ciudad" value="${esc(S.ciudad)}">
    <div id="negocios"><div class="cargando">Cargando…</div></div>`);
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    S.cat = c.dataset.c; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); cargarNegocios();
  });
  let t; $('#bCiudad').oninput = e => { clearTimeout(t); t = setTimeout(() => { S.ciudad = e.target.value.trim(); cargarNegocios(); }, 400); };
  await cargarNegocios();
}
async function cargarNegocios(){
  let q = sb.from('providers').select('*, reviews(calificacion)').eq('activo', true)
    .order('verificado', {ascending:false}).order('created_at', {ascending:false}).limit(100);
  if (S.cat) q = q.eq('categoria', S.cat);
  if (S.ciudad) q = q.ilike('ciudad', `%${S.ciudad}%`);
  const { data, error } = await q;
  const box = $('#negocios'); if (!box) return;
  if (error){ box.innerHTML = `<p class="error">${esc(traducir(error))}</p>`; return; }
  box.innerHTML = data.length ? `<div class="rejilla">${data.map(tarjetaNegocio).join('')}</div>`
    : `<div class="vacio"><div class="ico">🔍</div><h2>Todavía no hay negocios aquí</h2><p>Prueba con otra categoría o ciudad. Si conoces un buen servicio, invítalo a registrarse gratis.</p></div>`;
}
async function verNegocio(id){
  const { data: p, error } = await sb.from('providers').select('*, services(*), reviews(*)').eq('id', id).maybeSingle();
  if (error || !p) return toast(error ? traducir(error) : 'Este negocio ya no está disponible', 'err');
  const mio = S.user && p.owner_id === S.user.id;
  const servs = (p.services || []).filter(s => s.activo || mio);
  const rs = (p.reviews || []).sort((a, b) => b.created_at.localeCompare(a.created_at));
  const yaResene = S.user && rs.some(r => r.user_id === S.user.id);
  modal(`
    <div class="prov-top">
      <div class="mini" ${bg(p.logo_url)}>${p.logo_url ? '' : CAT_ICO[p.categoria]}</div>
      <div><h2 style="margin:0">${esc(p.nombre_negocio)}</h2>
        <span class="ayuda">${CATS[p.categoria]}${p.ciudad ? ', ' + esc(p.ciudad) : ''}</span><br>
        ${p.verificado ? '<span class="verif">✔ Verificado por GuauMatch</span> ' : ''}${estrellas(promedio(rs), rs.length)}</div>
    </div>
    ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
    ${p.direccion ? `<p>📍 ${esc(p.direccion)}</p>` : ''}
    <div class="fila" style="display:flex;gap:8px;flex-wrap:wrap">
      ${p.whatsapp ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa(p.whatsapp)}?text=${encodeURIComponent('Hola, los encontré en GuauMatch 🐾')}">WhatsApp</a>` : ''}
      ${p.telefono ? `<a class="btn sec" href="tel:${esc(p.telefono)}">Llamar</a>` : ''}
      ${mio ? `<button class="btn sec" onclick="formNegocio('${p.id}')">Editar negocio</button>` : ''}
    </div>
    <div class="seccion"><h3>Servicios y precios</h3>
      ${servs.length ? servs.map(s => `<div class="serv"><div><b>${esc(s.nombre)}</b>${s.duracion_min ? ` <span class="ayuda">(${s.duracion_min} min)</span>` : ''}${s.descripcion ? `<br><span class="ayuda">${esc(s.descripcion)}</span>` : ''}</div>
        <div style="text-align:right"><b>${s.precio != null ? cop(s.precio) : 'Consultar'}</b>${mio ? `<br><button class="link" onclick="borrarServicio('${s.id}','${p.id}')">Quitar</button>` : ''}</div></div>`).join('')
        : '<p class="ayuda">Este negocio aún no ha publicado sus servicios.</p>'}
      ${mio ? `<button class="btn peq" style="margin-top:10px" onclick="formServicio('${p.id}')">＋ Agregar servicio</button>` : ''}
    </div>
    <div class="seccion"><h3>Reseñas</h3>
      ${!mio && S.user && !yaResene ? `
        <form class="form" id="fResena" style="margin-bottom:12px">
          <label>Tu calificación<select name="c" required><option value="5">★★★★★ Excelente</option><option value="4">★★★★ Muy bueno</option><option value="3">★★★ Bueno</option><option value="2">★★ Regular</option><option value="1">★ Malo</option></select></label>
          <label>Comentario<textarea name="t" maxlength="600" placeholder="Cuéntales a otros dueños cómo te fue"></textarea></label>
          <p class="error" id="eResena"></p><button class="btn peq">Publicar reseña</button>
        </form>` : ''}
      ${!S.user ? `<p><button class="link" onclick="abrirAuth('login')">Ingresa</button> para dejar tu reseña.</p>` : ''}
      ${rs.length ? rs.map(r => `<div class="resena"><span class="estrellas">${'★'.repeat(r.calificacion)}${'☆'.repeat(5 - r.calificacion)}</span> <span class="ayuda">${fecha(r.created_at)}</span>${r.comentario ? `<br>${esc(r.comentario)}` : ''}</div>`).join('') : '<p class="ayuda">Sé el primero en dejar una reseña.</p>'}
    </div>`);
  const fr = $('#fResena');
  if (fr) fr.onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('reviews').insert({ provider_id: p.id, user_id: S.user.id, calificacion: +fr.c.value, comentario: fr.t.value.trim() || null });
    if (error){ $('#eResena').textContent = traducir(error); return; }
    toast('¡Gracias por tu reseña!'); verNegocio(p.id);
  };
}
async function formNegocio(id){
  let p = { ciudad: S.profile?.ciudad || '', activo: true };
  if (id){ const { data } = await sb.from('providers').select('*').eq('id', id).single(); p = data; }
  modal(`<h2>${id ? 'Editar negocio' : 'Registra tu negocio'}</h2>
    ${id ? '' : '<p class="ayuda">Gratis durante el lanzamiento. Tu negocio aparecerá de inmediato en el directorio.</p>'}
    <form class="form" id="fNeg">
      <label>Nombre del negocio<input name="nombre_negocio" required value="${esc(p.nombre_negocio || '')}" placeholder="Ej: Veterinaria Patitas"></label>
      <div class="dos">
        <label>Categoría<select name="categoria" required><option value="">Elige…</option>${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${p.categoria === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label>Ciudad<input name="ciudad" required value="${esc(p.ciudad || '')}" placeholder="Ej: Palmira"></label>
      </div>
      <label>Dirección<input name="direccion" value="${esc(p.direccion || '')}" placeholder="Ej: Calle 30 # 25 40, barrio Centro"></label>
      <div class="dos">
        <label>WhatsApp<input name="whatsapp" inputmode="tel" value="${esc(p.whatsapp || '')}" placeholder="3001234567"></label>
        <label>Teléfono<input name="telefono" inputmode="tel" value="${esc(p.telefono || '')}" placeholder="Opcional"></label>
      </div>
      <label>Descripción<textarea name="descripcion" maxlength="800" placeholder="Qué ofreces, horarios, qué te hace especial…">${esc(p.descripcion || '')}</textarea></label>
      <label>Logo o foto del negocio<input name="logo" type="file" accept="image/jpeg,image/png,image/webp"></label>
      ${id ? `<label class="check"><input type="checkbox" name="activo" ${p.activo ? 'checked' : ''}> Mostrar en el directorio</label>` : ''}
      <p class="error" id="eNeg"></p>
      <div class="fila" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">${id ? 'Guardar cambios' : 'Publicar negocio'}</button>
      ${id ? `<button type="button" class="btn peligro" onclick="borrarNegocio('${id}')">Eliminar negocio</button>` : ''}</div>
    </form>`);
  const f = $('#fNeg');
  f.onsubmit = async e => {
    e.preventDefault(); const btn = f.querySelector('[type=submit]'); $('#eNeg').textContent = ''; ocupado(btn, true);
    try {
      const v = Object.fromEntries(new FormData(f));
      const datos = { nombre_negocio: v.nombre_negocio.trim(), categoria: v.categoria, ciudad: v.ciudad.trim(), direccion: v.direccion.trim() || null,
        whatsapp: v.whatsapp.trim() || null, telefono: v.telefono.trim() || null, descripcion: v.descripcion.trim() || null };
      if (id) datos.activo = f.activo.checked;
      if (f.logo.files[0]){ btn.textContent = 'Subiendo logo…'; datos.logo_url = await subir(f.logo.files[0], 'negocios'); }
      let pid = id;
      if (id){ const { error } = await sb.from('providers').update(datos).eq('id', id); if (error) throw error; }
      else {
        const { data, error } = await sb.from('providers').insert({ ...datos, owner_id: S.user.id }).select('id').single(); if (error) throw error;
        pid = data.id;
        if (S.profile?.tipo !== 'proveedor') await sb.from('profiles').update({ tipo: 'proveedor' }).eq('id', S.user.id);
      }
      toast(id ? 'Cambios guardados' : '¡Tu negocio ya está publicado! Ahora agrega tus servicios.');
      await vServicios(); verNegocio(pid);
    } catch (err){ $('#eNeg').textContent = traducir(err); ocupado(btn, false); }
  };
}
async function borrarNegocio(id){
  if (!confirm('¿Eliminar este negocio? También se borrarán sus servicios y reseñas.')) return;
  const { error } = await sb.from('providers').delete().eq('id', id);
  if (error) return toast(traducir(error), 'err');
  cerrarModal(); toast('Negocio eliminado'); vServicios();
}
function formServicio(pid){
  modal(`<h2>Nuevo servicio</h2>
    <form class="form" id="fServ">
      <label>Nombre del servicio<input name="nombre" required placeholder="Ej: Baño y corte para perro mediano"></label>
      <div class="dos">
        <label>Precio (COP)<input name="precio" type="number" min="0" step="500" placeholder="Déjalo vacío si es a convenir"></label>
        <label>Duración (minutos)<input name="duracion_min" type="number" min="5" step="5" placeholder="Opcional"></label>
      </div>
      <label>Descripción<textarea name="descripcion" maxlength="400" placeholder="Qué incluye"></textarea></label>
      <p class="error" id="eServ"></p><button class="btn">Agregar servicio</button>
    </form>`);
  $('#fServ').onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    const { error } = await sb.from('services').insert({ provider_id: pid, nombre: v.nombre.trim(), descripcion: v.descripcion.trim() || null,
      precio: v.precio === '' ? null : +v.precio, duracion_min: v.duracion_min === '' ? null : +v.duracion_min });
    if (error){ $('#eServ').textContent = traducir(error); return; }
    toast('Servicio agregado'); verNegocio(pid);
  };
}
async function borrarServicio(sid, pid){
  if (!confirm('¿Quitar este servicio?')) return;
  const { error } = await sb.from('services').delete().eq('id', sid);
  if (error) return toast(traducir(error), 'err');
  verNegocio(pid);
}

/* ---------- PERFIL ---------- */
async function vPerfil(){
  await cargarMiInfo();
  const p = S.profile || {};
  app(`<div class="cabeza"><h1>Mi perfil</h1><button class="btn sec" onclick="salir()">Cerrar sesión</button></div>
    <div style="max-width:560px">
      <p class="lanz">🎉 Tu cuenta es gratis durante el lanzamiento</p>
      <form class="form" id="fPerfil">
        <div style="display:flex;gap:14px;align-items:center">
          <div class="mini" style="width:84px;height:84px" ${bg(p.avatar_url)}>${p.avatar_url ? '' : '👤'}</div>
          <label style="flex:1">Foto de perfil<input name="avatar" type="file" accept="image/jpeg,image/png,image/webp"></label>
        </div>
        <label>Nombre<input name="nombre" value="${esc(p.nombre || '')}" required></label>
        <div class="dos">
          <label>Ciudad<input name="ciudad" value="${esc(p.ciudad || '')}" placeholder="Ej: Palmira"></label>
          <label>Teléfono<input name="telefono" inputmode="tel" value="${esc(p.telefono || '')}" placeholder="Opcional"></label>
        </div>
        <p class="ayuda">Correo: ${esc(S.user.email)}</p>
        <p class="error" id="ePerfil"></p>
        <button class="btn">Guardar cambios</button>
      </form>
    </div>`);
  const f = $('#fPerfil');
  f.onsubmit = async e => {
    e.preventDefault(); const btn = f.querySelector('button.btn'); ocupado(btn, true);
    try {
      const datos = { nombre: f.nombre.value.trim(), ciudad: f.ciudad.value.trim() || null, telefono: f.telefono.value.trim() || null };
      if (f.avatar.files[0]) datos.avatar_url = await subir(f.avatar.files[0], 'perfil');
      const { error } = await sb.from('profiles').update(datos).eq('id', S.user.id); if (error) throw error;
      toast('Perfil actualizado'); await vPerfil(); pintarMenu('perfil');
    } catch (err){ $('#ePerfil').textContent = traducir(err); ocupado(btn, false); }
  };
}

/* ---------- arranque ---------- */
(function iniciar(){
  if (!window.supabase){ $('#avisoConfig').innerHTML = '<div class="config">No se pudo conectar. Revisa tu internet y recarga la página.</div>'; pintarMenu('inicio'); vInicio(); return; }
  if (SUPABASE_KEY.startsWith('PEGA')){
    $('#avisoConfig').innerHTML = '<div class="config">Falta conectar Supabase: abre este archivo y pega tu anon key en <code>SUPABASE_KEY</code>.</div>';
    pintarMenu('inicio'); vInicio(); return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let primera = true;
  sb.auth.onAuthStateChange((evento, sesion) => {
    setTimeout(async () => {
      const antes = S.user?.id; S.user = sesion?.user || null;
      if (evento === 'PASSWORD_RECOVERY') nuevaClave();
      if (primera || antes !== S.user?.id){
        primera = false;
        await cargarMiInfo();
        if (S.user && (!location.hash || location.hash === '#inicio')) { location.hash = '#explorar'; return; }
        if (!S.user && PRIVADAS.includes(location.hash.slice(1).split('/')[0])) { location.hash = '#inicio'; return; }
        render();
      }
    }, 0);
  });
})();
</script>
</body>
